<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>학생 화면 — 사회적 출발선</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="conn-warning" style="display:none; background:#B4432E; color:#fff; padding:12px 20px; text-align:center; font-size:0.92rem;"></div>

<div class="app-shell">
  <div class="topbar">
    <div class="brand">
      <span class="mark"></span>
      <h1>사회적 출발선</h1>
      <span class="role-tag">학생</span>
    </div>
    <div id="topbar-room" style="display:none;">
      <span class="room-chip" id="room-code-chip">----</span>
    </div>
  </div>

  <div class="main narrow" id="view-join">
    <div class="panel">
      <h2 class="section-title">방 입장하기</h2>
      <div class="stack">
        <div>
          <label class="helper">방 번호</label>
          <input type="text" id="join-code" placeholder="예: 1234" maxlength="4" inputmode="numeric" style="margin-top:6px;" />
        </div>
        <div>
          <label class="helper">학번</label>
          <input type="text" id="join-number" placeholder="예: 20315" inputmode="numeric" style="margin-top:6px;" />
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="btn-join">입장하기</button>
        <div class="error-text" id="join-error"></div>
      </div>
    </div>
  </div>

  <div class="main narrow" id="view-waiting" style="display:none;">
    <div class="waiting-note panel">
      <div class="big">입장 완료!</div>
      <p>선생님이 활동을 시작할 때까지 잠시 기다려주세요.</p>
      <p class="helper" style="margin-top:10px;">학번: <strong id="waiting-number"></strong></p>
    </div>
  </div>

  <div class="main narrow" id="view-active" style="display:none;">
    <div class="condition-card" id="condition-card">
      <h3>나에게 배정된 조건</h3>
      <div id="condition-list"></div>
    </div>

    <div class="panel" style="margin-top:16px;">
      <div class="q-index-student" id="q-index-label" style="color:var(--ink-soft); font-size:0.9rem; margin-bottom:6px;"></div>
      <h2 class="section-title" id="q-text" style="margin-bottom:0;">질문을 기다리는 중...</h2>

      <div class="choice-grid" id="choice-grid">
        <button class="choice-btn back" id="btn-choice-back">
          <div class="c-label" id="label-back">해당함</div>
          <div class="c-dir">뒤로 이동</div>
        </button>
        <button class="choice-btn forward" id="btn-choice-forward">
          <div class="c-label" id="label-forward">해당 없음</div>
          <div class="c-dir">이동 없음</div>
        </button>
      </div>

      <div class="my-position">
        현재 나의 위치: <strong id="my-position">0</strong>
      </div>
      <div class="helper" id="answered-note" style="text-align:center; display:none; margin-top:10px;">
        응답을 제출했습니다. 다음 질문을 기다려주세요.
      </div>
    </div>
  </div>

  <div class="main narrow" id="view-ended" style="display:none;">
    <div class="panel">
      <h2 class="section-title">활동이 끝났어요</h2>
      <p class="helper">나의 최종 위치: <strong id="final-position" style="color:var(--track); font-size:1.2rem;"></strong></p>
      <div class="divider"></div>
      <div class="condition-card" id="final-condition-card">
        <h3>내가 배정받았던 조건</h3>
        <div id="final-condition-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/common.js"></script>
<script src="js/student.js"></script>
</body>
</html>
