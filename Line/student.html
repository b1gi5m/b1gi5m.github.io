<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>학생 화면 — 출발선 실험</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="conn-warning" style="display:none; background:#B4432E; color:#fff; padding:12px 20px; text-align:center; font-size:0.92rem;"></div>

<div class="app-shell">
  <div class="topbar">
    <div class="brand">
      <span class="mark"></span>
      <h1>출발선 실험</h1>
      <span class="role-tag">학생</span>
    </div>
    <div id="topbar-room" style="display:none;">
      <span class="room-chip" id="room-code-chip">----</span>
    </div>
  </div>

  <div class="main narrow" id="view-join">
    <div class="panel">
      <h2 class="section-title">방 입장하기</h2>
      <div class="stack">
        <div>
          <label class="helper">방 번호</label>
          <input type="text" id="join-code" placeholder="예: 1234" maxlength="4" inputmode="numeric" style="margin-top:6px;" />
        </div>
        <div>
          <label class="helper">학번</label>
          <input type="text" id="join-number" placeholder="예: 1234" inputmode="numeric" style="margin-top:6px;" />
        </div>
        <div>
          <label class="helper" style="display:block; text-align:center;">성별</label>
          <div style="margin-top:6px; display:flex; gap:14px; justify-content:center;">
            <button type="button" class="choice-btn gender-btn" id="btn-gender-male" style="padding:14px 0; width:84px;">
              <div class="c-label">남</div>
            </button>
            <button type="button" class="choice-btn gender-btn" id="btn-gender-female" style="padding:14px 0; width:84px;">
              <div class="c-label">여</div>
            </button>
          </div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="btn-join">입장하기</button>
        <div class="error-text" id="join-error"></div>
      </div>
    </div>
  </div>

  <div class="main narrow" id="view-waiting" style="display:none;">
    <div class="waiting-note panel">
      <div class="big">입장 완료!</div>
      <p>선생님이 활동을 시작할 때까지 잠시 기다려주세요.</p>
      <p class="helper" style="margin-top:10px;">학번: <strong id="waiting-number"></strong></p>
      <button class="btn btn-ghost" id="btn-leave-waiting" style="margin-top:18px;">처음 화면으로</button>
    </div>
  </div>

  <div class="main wide" id="view-active" style="display:none;">

    <!-- 1단계: 조건 확인 (활동 시작 직후 1회) -->
    <div id="sub-intro">
      <div class="condition-card intro">
        <h3 id="intro-heading">나에게 배정된 조건</h3>
        <p id="condition-list-intro" class="condition-narrative"></p>
      </div>
      <button class="btn btn-primary btn-block btn-lg" id="btn-intro-continue" style="margin-top:16px;">
        확인
      </button>
    </div>

    <!-- 2단계: 질문 응답 -->
    <div id="sub-question" style="display:none;">
      <div class="condition-strip" id="condition-strip"></div>

      <div class="track-wrap my-track-wrap">
        <div class="helper" style="margin-bottom:8px;">우리 반에서 나의 위치</div>
        <div class="track" id="my-track">
          <div class="baseline"></div>
        </div>
      </div>

      <span class="q-index-student" id="q-index-label" style="color:var(--ink-soft); font-size:0.85rem;"></span>

      <div class="panel question-panel" style="margin-top:8px;">
        <h2 class="big-question" id="q-text">질문을 기다리는 중...</h2>

        <div class="choice-grid" id="choice-grid">
          <button class="choice-btn" id="btn-choice-1">
            <div class="c-label" id="label-1">선택지1</div>
          </button>
          <button class="choice-btn" id="btn-choice-2">
            <div class="c-label" id="label-2">선택지2</div>
          </button>
        </div>

        <button class="btn btn-primary btn-block btn-lg" id="btn-confirm-choice" style="margin-top:16px;" disabled>
          확정하기
        </button>

        <div class="helper" id="answered-note" style="text-align:center; display:none; margin-top:10px;">
          응답을 제출했습니다. 다음 질문을 기다려주세요.
        </div>
      </div>
    </div>
  </div>

  <div class="main wide" id="view-ended" style="display:none;">
    <div class="panel">
      <h2 class="section-title">활동이 끝났어요</h2>
      <p class="helper">나의 최종 위치: <strong id="final-position" style="color:var(--track); font-size:1.2rem;"></strong></p>
      <p class="helper" id="final-percentile" style="margin-top:4px; display:none;"></p>
    </div>

    <div class="track-wrap my-track-wrap">
      <div class="helper" style="margin-bottom:8px;">우리 반에서 나의 최종 위치</div>
      <div class="track" id="my-track-ended">
        <div class="baseline"></div>
      </div>
    </div>

    <div class="panel" id="final-condition-card" style="margin-top:18px;">
      <h3>내가 배정받았던 조건</h3>
      <p id="final-condition-list" class="condition-narrative"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/common.js"></script>
<script src="js/student.js"></script>
</body>
</html>
