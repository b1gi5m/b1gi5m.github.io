<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>선생님 화면 — 출발선 실험</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="conn-warning" style="display:none; background:#B4432E; color:#fff; padding:12px 20px; text-align:center; font-size:0.92rem;"></div>

<div class="app-shell">
  <div class="topbar">
    <div class="brand">
      <span class="mark"></span>
      <h1>출발선 실험</h1>
      <span class="role-tag">선생님</span>
    </div>
    <div id="topbar-room" style="display:none;">
      <span class="room-chip" id="room-code-chip">----</span>
    </div>
  </div>

  <div class="main narrow" id="view-create">
    <div class="panel">
      <h2 class="section-title">활동방 만들기</h2>
      <button class="btn btn-primary btn-block btn-lg" id="btn-create-room" style="margin-top:6px;">방 만들기</button>

      <div class="divider"></div>

      <h2 class="section-title">이미 만든 방에 다시 들어가기</h2>
      <div class="stack">
        <input type="text" id="rejoin-code" placeholder="입장 코드 4자리" maxlength="4" inputmode="numeric" />
        <button class="btn btn-ghost btn-block" id="btn-rejoin-room">방 이어서 진행하기</button>
      </div>
      <div class="error-text" id="rejoin-error"></div>
    </div>
  </div>

  <div class="main" id="view-waiting" style="display:none;">
    <div class="panel code-display">
      <div class="code" id="room-code-big">----</div>
    </div>

    <div class="panel">
      <div class="row-between">
        <h2 class="section-title" style="margin-bottom:0;">입장한 학생 (<span id="student-count">0</span>명)</h2>
        <button class="btn btn-primary" id="btn-start-activity" disabled>활동 시작</button>
      </div>
      <div class="roster-grid" id="roster-grid">
        <div class="empty-note">아직 입장한 학생이 없습니다</div>
      </div>
      <div class="helper" id="config-status" style="margin-top:14px;"></div>

      <div class="divider"></div>
      <label style="display:flex; align-items:center; gap:10px; cursor:pointer;" title="조건 무작위 배정 없이 학생 스스로의 실제 상황 기준으로 응답합니다. 트랙에 마우스를 올려도 번호/조건이 보이지 않습니다.">
        <input type="checkbox" id="toggle-self-mode" style="width:18px; height:18px;" />
        <span style="font-size:0.92rem;">익명 모드</span>
      </label>
    </div>
  </div>

  <div class="main wide" id="view-intro" style="display:none;">
    <div class="panel">
      <h2 class="section-title" style="font-size:1.6rem;">활동 안내</h2>
      <p id="intro-instructions" class="instructions-box"></p>
    </div>

    <div class="panel" style="margin-top:18px;">
      <div class="row-between">
        <h3 style="font-size:1.15rem;">조건 확인 완료 (<span id="intro-confirmed-count">0 / 0</span>)</h3>
      </div>
      <div class="helper" style="margin-top:6px; margin-bottom:6px; font-size:0.95rem;">아직 확인하지 않은 학생</div>
      <div class="chip-list" id="intro-notconfirmed-list"></div>
    </div>

    <button class="btn btn-secondary btn-block btn-lg" id="btn-begin-questions" style="margin-top:18px;">
      질문 시작하기 →
    </button>
  </div>

  <div class="main" id="view-active" style="display:none;">
    <div class="track-wrap">
      <div class="track" id="track">
        <div class="baseline"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:18px;">
      <div class="question-block">
        <div class="q-index" id="q-index-label" style="color:#DDEAE3; font-size:0.85rem; margin-bottom:4px;">질문 1 / 4</div>
        <div id="q-text" style="font-family:var(--font-head); font-size:1.3rem; line-height:1.45;">질문 내용</div>
      </div>

      <div class="divider"></div>

      <div class="status-columns">
        <div class="status-col">
          <div class="status-col-title pending">미응답 (<span id="pending-count">0</span>)</div>
          <div class="chip-list" id="pending-list"></div>
        </div>
        <div class="status-col">
          <div class="status-col-title answered">응답 완료 (<span id="answered-count">0</span>)</div>
          <div class="chip-list" id="answered-list"></div>
        </div>
      </div>

      <div class="divider"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div class="progress-note" id="progress-note"></div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-secondary btn-lg" id="btn-next-question">다음 질문으로 →</button>
          <button class="btn btn-ghost btn-lg" id="btn-end-activity">활동 종료</button>
        </div>
      </div>
    </div>
  </div>

  <div class="main" id="view-ended" style="display:none;">
    <div class="track-wrap">
      <div class="track" id="track-ended">
        <div class="baseline"></div>
      </div>
    </div>
    <div class="panel" style="margin-top:18px;">
      <div class="stats-grid" id="ended-stats"></div>
    </div>
    <div class="panel" style="margin-top:18px; text-align:center;">
      <button class="btn btn-ghost" id="btn-delete-room">이 방 삭제하기</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="student-modal-backdrop" style="display:none;">
  <div class="modal-card">
    <button class="modal-close" id="btn-modal-close" aria-label="닫기">×</button>
    <h3 id="modal-title">번호</h3>
    <div class="condition-narrative" id="modal-condition"></div>
    <div class="divider"></div>
    <div class="card-header">응답 기록</div>
    <div id="modal-history"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/common.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
